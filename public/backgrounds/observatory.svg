<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep abyssal viridian sky to crater lake base -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05110f"/>
      <stop offset="36%" stop-color="#081a17"/>
      <stop offset="60%" stop-color="#0e2a24"/>
      <stop offset="72%" stop-color="#14372f"/>
      <stop offset="78%" stop-color="#0c241e"/>
      <stop offset="100%" stop-color="#061210"/>
    </linearGradient>

    <!-- Soft nocturnal moonlight wash off-center right-low so center horizon stays quiet -->
    <radialGradient id="moonGlow" cx="68%" cy="66%" r="44%">
      <stop offset="0%" stop-color="#4e7d6c" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#1e493d" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#061210" stop-opacity="0"/>
    </radialGradient>

    <!-- Mottled viridian nebula texture in upper corners -->
    <radialGradient id="mottleLeft" cx="18%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#14352c" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#05110f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mottleRight" cx="84%" cy="18%" r="32%">
      <stop offset="0%" stop-color="#173d33" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#05110f" stop-opacity="0"/>
    </radialGradient>

    <!-- Mist bands over the emerald crater lake -->
    <linearGradient id="mistBand1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8fb8a3" stop-opacity="0.0"/>
      <stop offset="28%" stop-color="#8fb8a3" stop-opacity="0.09"/>
      <stop offset="65%" stop-color="#a6c8b6" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#8fb8a3" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="mistBand2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7ba390" stop-opacity="0.03"/>
      <stop offset="50%" stop-color="#9dc0ae" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#7ba390" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Water shimmer vertical gradient -->
    <linearGradient id="lakeReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#214d40" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#0c241e" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#061210" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Subtle painterly noise filter -->
    <filter id="softBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="gentleMist" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.045"/>
      </feComponentTransfer>
    </filter>

    <!-- Bottom fade seamlessly into subterranean chamber -->
    <linearGradient id="bottomTransition" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071311" stop-opacity="0"/>
      <stop offset="70%" stop-color="#071311" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#071311" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Base Viridian Twilight Sky & Lake -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>
  <rect width="1920" height="1080" fill="url(#mottleLeft)"/>
  <rect width="1920" height="1080" fill="url(#mottleRight)"/>
  <rect width="1920" height="1080" fill="url(#moonGlow)"/>

  <!-- Faint celestial starlight dust in far upper sky -->
  <g fill="#edeae0" opacity="0.22">
    <circle cx="310" cy="140" r="0.9"/>
    <circle cx="520" cy="92" r="0.7"/>
    <circle cx="740" cy="180" r="0.8"/>
    <circle cx="1180" cy="110" r="1.0"/>
    <circle cx="1410" cy="165" r="0.7"/>
    <circle cx="1590" cy="96" r="0.9"/>
    <circle cx="1710" cy="210" r="0.6"/>
    <circle cx="240" cy="260" r="0.6"/>
    <circle cx="960" cy="78" r="0.7"/>
  </g>

  <!-- Distant Crater Rim Ridges (kept low so center horizon stays wide open) -->
  <path d="M0 720 Q180 650 380 675 T820 715 T1260 692 T1640 658 L1920 680 L1920 800 L0 800 Z" fill="#091d18" opacity="0.86"/>
  <path d="M0 748 Q260 695 520 726 T1040 742 T1540 704 T1920 718 L1920 820 L0 820 Z" fill="#071713" opacity="0.94"/>

  <!-- Neoclassical Romanian Athenaeum Silhouette on the Quiet Far Right-Shore Promontory -->
  <g transform="translate(1325, 622)" opacity="0.72">
    <!-- Subtle luminous mist halo behind rotunda -->
    <ellipse cx="148" cy="72" rx="140" ry="52" fill="#4f8370" opacity="0.14" filter="url(#softBlur)"/>
    <!-- Classical stone plinth and steps -->
    <rect x="26" y="106" width="244" height="12" fill="#0a1f1a"/>
    <rect x="40" y="96" width="216" height="11" fill="#0d2620"/>
    <!-- Drum & Rotunda Body -->
    <rect x="64" y="54" width="168" height="44" fill="#0e2a23"/>
    <!-- Ribbed Neoclassical Dome -->
    <path d="M78 55 C78 14, 218 14, 218 55 Z" fill="#12322a"/>
    <path d="M98 54 C98 24, 198 24, 198 54" fill="none" stroke="#8fb8a3" stroke-opacity="0.16" stroke-width="1"/>
    <path d="M122 54 C122 20, 174 20, 174 54" fill="none" stroke="#8fb8a3" stroke-opacity="0.18" stroke-width="1"/>
    <!-- Dome Cupola & Finial -->
    <rect x="139" y="12" width="18" height="12" fill="#153a31"/>
    <path d="M142 12 Q148 2 154 12 Z" fill="#1b483d"/>
    <line x1="148" y1="0" x2="148" y2="9" stroke="#9ec4b1" stroke-opacity="0.4" stroke-width="1.2"/>
    <!-- Classical Triangular Pediment -->
    <polygon points="82,66 148,43 214,66" fill="#153930"/>
    <polygon points="88,65 148,46 208,65" fill="none" stroke="#8fb8a3" stroke-opacity="0.22" stroke-width="1"/>
    <!-- Six Ionic Columns -->
    <g fill="#1c473c" opacity="0.88">
      <rect x="92" y="66" width="6" height="31"/>
      <rect x="112" y="66" width="6" height="31"/>
      <rect x="132" y="66" width="6" height="31"/>
      <rect x="158" y="66" width="6" height="31"/>
      <rect x="178" y="66" width="6" height="31"/>
      <rect x="198" y="66" width="6" height="31"/>
    </g>
    <!-- Faint warm sanctuary lantern glow behind portico -->
    <rect x="102" y="76" width="92" height="18" fill="#c2a878" opacity="0.11" filter="url(#gentleMist)"/>
    <!-- Pine & cypress silhouettes flanking the temple -->
    <path d="M10 116 L22 72 L34 116 Z M264 116 L278 66 L292 116 Z M282 116 L294 82 L306 116 Z" fill="#061410"/>
  </g>

  <!-- Emerald Crater Lake Surface -->
  <rect x="0" y="738" width="1920" height="342" fill="url(#lakeReflection)"/>

  <!-- Reflected Temple Shimmer on Lake -->
  <g transform="translate(1325, 742)" opacity="0.22" filter="url(#gentleMist)">
    <ellipse cx="148" cy="24" rx="88" ry="10" fill="#8fb8a3" opacity="0.28"/>
    <ellipse cx="148" cy="54" rx="64" ry="8" fill="#c2a878" opacity="0.16"/>
    <ellipse cx="148" cy="88" rx="44" ry="6" fill="#8fb8a3" opacity="0.14"/>
  </g>

  <!-- Subtle Horizontal Water Ripples -->
  <g stroke="#8fb8a3" stroke-opacity="0.07" stroke-width="1">
    <line x1="180" y1="772" x2="540" y2="772"/>
    <line x1="680" y1="796" x2="1120" y2="796"/>
    <line x1="1260" y1="782" x2="1680" y2="782"/>
    <line x1="340" y1="836" x2="880" y2="836"/>
    <line x1="1080" y1="854" x2="1540" y2="854"/>
    <line x1="560" y1="904" x2="1220" y2="904"/>
  </g>

  <!-- Drifting Crater Mist Veils -->
  <ellipse cx="520" cy="735" rx="540" ry="38" fill="url(#mistBand1)" filter="url(#softBlur)"/>
  <ellipse cx="1380" cy="744" rx="600" ry="44" fill="url(#mistBand2)" filter="url(#softBlur)"/>
  <ellipse cx="960" cy="765" rx="760" ry="28" fill="url(#mistBand1)" opacity="0.65" filter="url(#softBlur)"/>

  <!-- Bottom Edge Transition into Secret Chamber -->
  <rect x="0" y="840" width="1920" height="240" fill="url(#bottomTransition)"/>

  <!-- Fine Painterly Film Grain -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.8"/>
</svg>
