<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep subterranean stone-and-walnut viridian base -->
    <linearGradient id="chamberBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071311"/>
      <stop offset="14%" stop-color="#0a1714"/>
      <stop offset="55%" stop-color="#0c1916"/>
      <stop offset="100%" stop-color="#07110f"/>
    </linearGradient>

    <!-- Warm distant candlelight sconces on far outer edges -->
    <radialGradient id="leftSconce" cx="4%" cy="38%" r="28%">
      <stop offset="0%" stop-color="#c2a878" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#4e4430" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#091512" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rightSconce" cx="96%" cy="38%" r="28%">
      <stop offset="0%" stop-color="#c2a878" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#4e4430" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#091512" stop-opacity="0"/>
    </radialGradient>

    <!-- Center slate-green subtle radial vignette -->
    <radialGradient id="centerCalm" cx="50%" cy="48%" r="54%">
      <stop offset="0%" stop-color="#132621" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#060f0d" stop-opacity="0.65"/>
    </radialGradient>

    <!-- Brushed antique brass hairline gradient -->
    <linearGradient id="brassLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c2a878" stop-opacity="0.0"/>
      <stop offset="22%" stop-color="#c2a878" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#d7c296" stop-opacity="0.3"/>
      <stop offset="78%" stop-color="#c2a878" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c2a878" stop-opacity="0.0"/>
    </linearGradient>

    <filter id="stoneGrain">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.04"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <!-- Subterranean Base -->
  <rect width="1920" height="1080" fill="url(#chamberBase)"/>
  <rect width="1920" height="1080" fill="url(#centerCalm)"/>
  <rect width="1920" height="1080" fill="url(#leftSconce)"/>
  <rect width="1920" height="1080" fill="url(#rightSconce)"/>

  <!-- Recessed Architectural Boiserie Wood & Stone Paneling -->
  <g stroke="#8fb8a3" stroke-opacity="0.055" fill="none" stroke-width="1">
    <!-- Outer Left Pilaster -->
    <rect x="44" y="72" width="110" height="936" fill="#081411" fill-opacity="0.45"/>
    <line x1="64" y1="90" x2="64" y2="990"/>
    <line x1="134" y1="90" x2="134" y2="990"/>

    <!-- Outer Right Pilaster -->
    <rect x="1766" y="72" width="110" height="936" fill="#081411" fill-opacity="0.45"/>
    <line x1="1786" y1="90" x2="1786" y2="990"/>
    <line x1="1856" y1="90" x2="1856" y2="990"/>

    <!-- Subtle Recessed Wall Panels across center -->
    <rect x="196" y="96" width="1528" height="888" stroke="#c2a878" stroke-opacity="0.07"/>
    <rect x="212" y="112" width="1496" height="856" stroke="#8fb8a3" stroke-opacity="0.04"/>
  </g>

  <!-- Antique Brass Architectural Cornice & Dado Hairlines -->
  <line x1="120" y1="72" x2="1800" y2="72" stroke="url(#brassLine)" stroke-width="1"/>
  <line x1="120" y1="1008" x2="1800" y2="1008" stroke="url(#brassLine)" stroke-width="1"/>

  <!-- Subtle Classical Astrolabe Meridian Watermark centered quietly in the deep stone -->
  <g transform="translate(960, 540)" stroke="#c2a878" stroke-opacity="0.045" fill="none">
    <circle r="340" stroke-width="1"/>
    <circle r="260" stroke-width="0.75" stroke-dasharray="4 10"/>
    <ellipse rx="340" ry="120" stroke-width="0.75"/>
    <ellipse rx="120" ry="340" stroke-width="0.75"/>
    <line x1="-380" y1="0" x2="380" y2="0" stroke-width="0.6"/>
    <line x1="0" y1="-380" x2="0" y2="380" stroke-width="0.6"/>
  </g>

  <!-- Fine Honed Stone Texture -->
  <rect width="1920" height="1080" filter="url(#stoneGrain)" opacity="0.75"/>
</svg>
