<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="navyBg" cx="50%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#182136"/>
      <stop offset="58%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#080B14"/>
    </radialGradient>
    <linearGradient id="brassMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6DA97"/>
      <stop offset="48%" stop-color="#E2B46D"/>
      <stop offset="100%" stop-color="#9E7638"/>
    </linearGradient>
    <linearGradient id="brassVert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7DDA0"/>
      <stop offset="55%" stop-color="#E2B46D"/>
      <stop offset="100%" stop-color="#A67D3C"/>
    </linearGradient>
  </defs>

  <!-- Deep Midnight Navy Rounded Emblem Base -->
  <rect width="512" height="512" rx="96" fill="url(#navyBg)"/>
  <rect x="20" y="20" width="472" height="472" rx="78" fill="none" stroke="url(#brassMain)" stroke-width="3.5" opacity="0.5"/>
  <rect x="34" y="34" width="444" height="444" rx="66" fill="none" stroke="#E2B46D" stroke-width="1.25" opacity="0.22"/>

  <!-- Cupola Finial & Lantern -->
  <line x1="256" y1="68" x2="256" y2="92" stroke="url(#brassVert)" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="256" cy="98" r="7" fill="url(#brassMain)"/>
  <path d="M236 122 C236 108 276 108 276 122 Z" fill="url(#brassVert)"/>
  <rect x="232" y="122" width="48" height="10" rx="2" fill="url(#brassMain)"/>

  <!-- Classical Neoclassical Ribbed Rotunda Dome -->
  <path d="M138 228 C138 156 190 128 256 128 C322 128 374 156 374 228 Z" fill="url(#brassVert)" opacity="0.16"/>
  <path d="M138 228 C138 156 190 128 256 128 C322 128 374 156 374 228" fill="none" stroke="url(#brassMain)" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Dome Architectural Ribs -->
  <path d="M178 228 C184 166 214 134 256 129" fill="none" stroke="#E2B46D" stroke-width="3" opacity="0.72"/>
  <path d="M334 228 C328 166 298 134 256 129" fill="none" stroke="#E2B46D" stroke-width="3" opacity="0.72"/>
  <path d="M218 228 C222 174 236 138 256 129" fill="none" stroke="#E2B46D" stroke-width="2.5" opacity="0.58"/>
  <path d="M294 228 C290 174 276 138 256 129" fill="none" stroke="#E2B46D" stroke-width="2.5" opacity="0.58"/>
  <line x1="256" y1="129" x2="256" y2="228" stroke="#E2B46D" stroke-width="2.5" opacity="0.62"/>

  <!-- Drum & Cornice -->
  <rect x="124" y="226" width="264" height="11" rx="2" fill="url(#brassMain)"/>

  <!-- Classical Triangular Pediment -->
  <polygon points="256,204 148,256 364,256" fill="#0E131F" stroke="url(#brassMain)" stroke-width="6.5" stroke-linejoin="round"/>
  <polygon points="256,219 184,250 328,250" fill="url(#brassMain)" opacity="0.22"/>
  <circle cx="256" cy="237" r="6" fill="url(#brassMain)"/>

  <!-- Entablature Architrave -->
  <rect x="132" y="256" width="248" height="14" rx="2" fill="url(#brassMain)"/>

  <!-- Six Iconic Ionic Colonnade Columns -->
  <g fill="url(#brassVert)">
    <!-- Column 1 -->
    <rect x="150" y="274" width="16" height="112" rx="2"/>
    <rect x="145" y="270" width="26" height="7" rx="2"/>
    <rect x="146" y="384" width="24" height="7" rx="1.5"/>
    <!-- Column 2 -->
    <rect x="189" y="274" width="16" height="112" rx="2"/>
    <rect x="184" y="270" width="26" height="7" rx="2"/>
    <rect x="185" y="384" width="24" height="7" rx="1.5"/>
    <!-- Column 3 -->
    <rect x="228" y="274" width="16" height="112" rx="2"/>
    <rect x="223" y="270" width="26" height="7" rx="2"/>
    <rect x="224" y="384" width="24" height="7" rx="1.5"/>
    <!-- Column 4 -->
    <rect x="268" y="274" width="16" height="112" rx="2"/>
    <rect x="263" y="270" width="26" height="7" rx="2"/>
    <rect x="264" y="384" width="24" height="7" rx="1.5"/>
    <!-- Column 5 -->
    <rect x="307" y="274" width="16" height="112" rx="2"/>
    <rect x="302" y="270" width="26" height="7" rx="2"/>
    <rect x="303" y="384" width="24" height="7" rx="1.5"/>
    <!-- Column 6 -->
    <rect x="346" y="274" width="16" height="112" rx="2"/>
    <rect x="341" y="270" width="26" height="7" rx="2"/>
    <rect x="342" y="384" width="24" height="7" rx="1.5"/>
  </g>

  <!-- Stepped Classical Stylobate / Grand Stairs -->
  <rect x="122" y="392" width="268" height="11" rx="2" fill="url(#brassMain)"/>
  <rect x="106" y="407" width="300" height="11" rx="2" fill="url(#brassMain)" opacity="0.88"/>
  <rect x="92" y="422" width="328" height="12" rx="3" fill="url(#brassMain)" opacity="0.72"/>
</svg>
