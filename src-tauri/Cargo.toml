[package]
name = "athenaeum"
version = "0.1.0"
description = "Athenaeum Personal Productivity OS and Digital Sanctum"
authors = ["Pablo Gonzalez"]
license = "MIT"
edition = "2021"

[lib]
name = "athenaeum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tiny_http = "0.12"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Media", "Media_Control", "Foundation", "Foundation_Collections"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
